# Release notes for Corfedo repositories, generated by git-cliff from Conventional Commits.
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{%- macro commit_line(commit) -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | replace(from=" [skip ci]", to="") | trim | upper_first }}\
{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}: \
{{ commit.breaking_description | trim }}{% endif %} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }})) \
by {% if commit.remote.username %}@{{ commit.remote.username }}{% else %}{{ commit.author.name }}{% endif %}
{%- endmacro commit_line -%}

{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{%- if breaking | length > 0 %}
## Breaking changes
{% for commit in breaking %}
{{ self::commit_line(commit=commit) }}

{%- endfor %}
{% endif %}

{#- Breaking changes are listed once, in their own section. #}
{%- for group, group_commits in commits | group_by(attribute="group") %}
{%- if group_commits | length > group_commits | filter(attribute="breaking", value=true) | length %}
## {{ group | striptags | trim }}
{% for commit in group_commits %}
{%- if not commit.breaking %}
{{ self::commit_line(commit=commit) }}
{%- endif %}
{%- endfor %}
{% endif %}
{%- endfor %}

{%- set new_contributors = github.contributors | filter(attribute="is_first_time", value=true) -%}
{%- if new_contributors | length > 0 %}
## New contributors
{% for contributor in new_contributors %}
- @{{ contributor.username }} made their first contribution
{%- endfor %}
{% endif %}

{%- if previous.version %}
**Full changelog:** https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}
{%- endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+.*$"
topo_order = false
sort_commits = "oldest"
# The HTML comments order the groups; striptags removes them from the headings.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^build", group = "<!-- 4 -->Build and dependencies" },
  { message = "^(refactor|test|ci|chore|style)", skip = true },
  { message = ".*", group = "<!-- 9 -->Other changes" },
]
