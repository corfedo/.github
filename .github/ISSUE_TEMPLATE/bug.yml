name: Bug report
description: Report a reproducible problem in a Corfedo project.
body:
  - type: markdown
    attributes:
      value: |
        Open this issue in the affected project repository.
        Please remove credentials, tokens, and proprietary source code from examples and logs.
        For security vulnerabilities, follow the [security policy](https://github.com/corfedo/.github/blob/main/SECURITY.md) instead of opening a public issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What problem did you encounter?
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: Name the component, command, endpoint, or module involved, if known.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the release version or commit SHA. Write "unknown" if unavailable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal example and the steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, deployment, and client details.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, and proprietary source code before sharing.
      render: text
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include related issues, screenshots, or other useful details.
    validations:
      required: false
